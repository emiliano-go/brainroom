[package]
name = "brainroom"
version = "0.0.1"
edition.workspace = true
license.workspace = true
description = "A native Rust + Qt reimplementation of LearnHarness"
default-run = "brainroom"

[dependencies]
cxx = "1.0"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
cxx-qt-build = "0.10"
