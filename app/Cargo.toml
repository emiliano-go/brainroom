[package]
name = "brainroom"
version = "0.0.1"
edition.workspace = true
license.workspace = true
description = "A native Rust + Qt reimplementation of LearnHarness"
default-run = "brainroom"

[dependencies]
cxx = "1.0"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
anyhow = "1"
brainroom-core = { path = "../crates/core" }
brainroom-store = { path = "../crates/store" }

[build-dependencies]
cxx-qt-build = "0.10"
