[package]
name = "brainroom-rune"
version = "0.0.1"
edition.workspace = true
license.workspace = true
description = "Rune UI for Brainroom"
publish = false

[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "3ff3cc6152b9034a1d996e3a5575c51fab3b56b8" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "3ff3cc6152b9034a1d996e3a5575c51fab3b56b8", features = ["markdown"] }
brainroom-agent = { path = "../crates/agent" }
brainroom-ai = { path = "../crates/ai" }
brainroom-core = { path = "../crates/core" }
brainroom-extract = { path = "../crates/extract" }
brainroom-store = { path = "../crates/store" }
serde_json = "1"
katex-native = { version = "0.1.1", features = ["raster"] }
time = { version = "0.3", features = ["parsing"] }
